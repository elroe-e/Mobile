name: CI

on:
  push:
    branches: [main, "ccr-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.2.12479018
  DX_VERSION: 0.7.10

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        # Twice the Ubuntu step stalled for 40 minutes. Only the Ubuntu archive is used (the
        # runner's extra sources, e.g. Microsoft and PPAs, aren't needed); each attempt gets
        # 8 minutes; from the second attempt on, the main Ubuntu mirror replaces Azure's.
        timeout-minutes: 30
        run: |
          sudo mkdir -p /etc/apt/sources.list.d.off
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f ! -name 'ubuntu.sources' \
            -exec mv -t /etc/apt/sources.list.d.off {} +
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' \
                /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2> /dev/null || true
            fi
            if sudo timeout 480 apt-get $apt_opts update &&
               sudo timeout 480 apt-get $apt_opts install -y -qq libasound2-dev pkg-config \
                 libwebkit2gtk-4.1-dev libxdo-dev ffmpeg xvfb xdotool imagemagick pulseaudio; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sudo dpkg --configure -a || true
            sleep 10
          done
          exit 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (crates)
        run: cargo clippy -p loss-core -p loss-audio -p loss-download -p loss-platform -p loss-store -p loss-i18n -p loss-usb --all-targets -- -D warnings
      - name: Clippy (app, desktop build)
        run: cargo clippy -p loss --no-default-features --features desktop --all-targets -- -D warnings
      - name: Tests (crates)
        run: cargo test -p loss-core -p loss-audio -p loss-download -p loss-platform -p loss-store -p loss-i18n -p loss-usb
      - name: Database speed (50,000 songs load in under 1 s)
        run: cargo test -p loss-store --release -- --ignored
      - name: Tests (app)
        run: cargo test -p loss --no-default-features --features desktop
      - name: Translations (no hard-coded UI text, every id defined)
        run: python3 scripts/check-i18n.py
      - name: Plan consistency
        run: python3 scripts/check-plan.py
      # M0-12: generated audio fixtures and a scripted UI tour.
      - name: Audio fixtures
        run: bash scripts/make-fixtures.sh
      - name: Tests on the fixtures (formats, tags, gapless joins)
        run: cargo test -p loss-audio -p loss-core -- --ignored generated
      - name: UI smoke tour (English and pseudo-locales)
        run: bash scripts/ui-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke
          path: |
            target/ui-smoke/*/*.png
            target/ui-smoke/*/stdout.txt
            target/ui-smoke/*/data/logs/
          if-no-files-found: warn

  android:
    name: Android APK (${{ matrix.abi }})
    needs: check
    # Saves Actions minutes: the APK is built on PRs, main and manual runs, not on every branch push.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            target: aarch64-linux-android
          # x86_64 is for the emulator smoke test (M0-03).
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.abi }}
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Cache Dioxus CLI
        id: dx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: dx-${{ env.DX_VERSION }}-${{ runner.os }}
      - name: Install Dioxus CLI
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version "$DX_VERSION" --locked
      # Gradle's downloads, kept between runs: Maven Central sometimes answers 429 (Too Many Requests).
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ env.DX_VERSION }}-${{ hashFiles('android/glue/build.gradle.kts') }}
          restore-keys: gradle-${{ env.DX_VERSION }}-
      - name: Build APK
        working-directory: app
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          # Retry when Gradle can't download (rate limits); the Rust build is reused.
          for attempt in 1 2 3; do
            dx bundle --platform android --release --target ${{ matrix.target }} && break
            [ $attempt = 3 ] && exit 1
            echo "::warning::APK build failed (attempt $attempt), retrying in $((attempt * 45)) s"
            sleep $((attempt * 45))
          done
          cp ../target/dx/loss/release/android/app/app/build/outputs/apk/debug/app-debug.apk ../Loss-${{ matrix.abi }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Loss-${{ matrix.abi }}-apk
          path: Loss-${{ matrix.abi }}.apk
          if-no-files-found: error

      # M0-03: boot an emulator, install, launch, screenshot; fail on any crash.
      - name: Enable KVM
        if: matrix.abi == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test
        if: matrix.abi == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/emulator-smoke.sh Loss-x86_64.apk target/emulator-smoke
      - uses: actions/upload-artifact@v4
        if: always() && matrix.abi == 'x86_64'
        with:
          name: emulator-smoke
          path: target/emulator-smoke/
          if-no-files-found: warn
