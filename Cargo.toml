[workspace]
members = ["crates/loss-core", "crates/loss-audio", "crates/loss-download", "crates/loss-platform", "crates/loss-store", "crates/loss-i18n", "app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
loss-core = { path = "crates/loss-core" }
loss-audio = { path = "crates/loss-audio" }
loss-download = { path = "crates/loss-download" }
loss-platform = { path = "crates/loss-platform" }
loss-store = { path = "crates/loss-store" }
loss-i18n = { path = "crates/loss-i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
lofty = "0.22"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
