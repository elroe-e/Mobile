[application]
name = "Loss"
out_dir = "dist"
# Android glue: media service, lock-screen controls, permission prompts.
android_manifest = "android/AndroidManifest.xml"
android_main_activity = "android/MainActivity.kt"

[bundle]
identifier = "app.loss.player"
publisher = "Loss"
short_description = "A music player and downloader written in Rust"

[android]
min_sdk = 26
target_sdk = 35

# Permissions are declared in android/AndroidManifest.xml.

[android.application]
uses_cleartext_traffic = true
