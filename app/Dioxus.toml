[application]
name = "Loss"
out_dir = "dist"

[bundle]
identifier = "app.loss.player"
publisher = "Loss"
short_description = "A music player and downloader written in Rust"

[android]
min_sdk = 26
target_sdk = 35

[android.permissions]
"android.permission.READ_MEDIA_AUDIO" = { description = "Read your music files" }
"android.permission.READ_EXTERNAL_STORAGE" = { description = "Read your music files (Android 12 and older)" }

[android.application]
uses_cleartext_traffic = true
