[package]
name = "loss-audio"
version.workspace = true
edition.workspace = true

[dependencies]
log.workspace = true
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.16"
rubato = "5.1"
audioadapter-buffers = "5.2"
rtrb = "0.3"
opus-decoder = "0.1"
# WavPack (pure Rust, MIT/Apache), M2-08.
wavicle = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
# AAudio bindings (the NDK's C API; no extra C code) for the native output, M2-02.
ndk-sys = { version = "0.6", features = ["audio"] }
libc = "0.2"
